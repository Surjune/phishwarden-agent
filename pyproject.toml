[project]
name = "phishwarden"
version = "0.1.0"
description = "Phishing triage and response agent with runtime access control enforced by AgntID"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "mcp",
    "httpx",
    "python-dotenv",
    "streamlit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phishwarden"]
