<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhishWarden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #fafbfc;
  --border: #e6e8ec;
  --border-strong: #d7dbe2;
  --text: #0e1525;
  --text-2: #3d4657;
  --muted: #6b7486;
  --subtle: #98a0ae;
  --accent: #4f46e5;
  --accent-2: #4338ca;
  --accent-soft: #eef0ff;
  --ok: #047857; --ok-soft: #e9f8f1; --ok-line: #bfe9d5;
  --risk: #d92d4a; --risk-soft: #fff0f2; --risk-line: #fbcbd3;
  --violet: #6d28d9; --violet-soft: #f4effe; --violet-line: #dccbfb;
  --warn: #b45309; --warn-soft: #fff7e8; --warn-line: #fbdba7;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 2px rgba(14,21,37,.05);
  --shadow: 0 1px 3px rgba(14,21,37,.06), 0 1px 2px rgba(14,21,37,.04);
  --shadow-lg: 0 12px 32px -12px rgba(14,21,37,.18);
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px; line-height: 1.55; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 15px; height: 15px; }
svg.i.lg { width: 22px; height: 22px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
  padding: 22px 16px 18px; border-right: 1px solid var(--border); background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 12px; padding: 2px 8px 22px; }
.logo {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, #6366f1 0%, #4338ca 60%, #312e81 100%);
  box-shadow: 0 6px 16px -6px rgba(79,70,229,.6);
}
.brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand-sub { font-size: 12px; color: var(--muted); }
.nav-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--subtle); padding: 14px 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 9px;
  color: var(--text-2); font-weight: 500; margin-bottom: 2px; transition: background .12s, color .12s;
}
.nav-item:hover { background: #f2f3f6; color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-2); }
.nav-item .count { margin-left: auto; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 1px 8px; }
.count.risk { background: var(--risk-soft); color: var(--risk); }
.count.violet { background: var(--violet-soft); color: var(--violet); }
.count.live { background: var(--accent-soft); color: var(--accent); }
.systems { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }
.sys { display: flex; align-items: center; gap: 10px; padding: 7px 10px; font-size: 13px; color: var(--text-2); }
.sys .state { margin-left: auto; font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--subtle); flex: none; }
.dot.up { background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.15); }
.dot.down { background: var(--risk); box-shadow: 0 0 0 3px rgba(217,45,74,.15); }
.side-links { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; }
.side-links a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; font-size: 13px; color: var(--muted); }
.side-links a:hover { background: #f2f3f6; color: var(--text); }

main { min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 5; height: 64px; display: flex; align-items: center; gap: 16px;
  padding: 0 36px; background: rgba(245,246,248,.85); backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--border);
}
.crumbs { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.crumbs b { color: var(--text); font-weight: 600; }
.topbar .spacer { flex: 1; }
.content { max-width: 1160px; margin: 0 auto; padding: 30px 36px 64px; }

/* ---------- primitives ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-weight: 500;
  box-shadow: var(--shadow-sm); transition: background .12s, border-color .12s, box-shadow .12s, transform .05s;
  white-space: nowrap;
}
.btn:hover { background: #f8f9fb; border-color: #c9ced7; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 6px 14px -8px rgba(79,70,229,.8); }
.btn.primary:hover { background: var(--accent-2); }
.btn.danger-outline { color: var(--risk); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn.lg { height: 44px; padding: 0 20px; font-size: 14.5px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px;
  font-size: 12px; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
}
.pill.risk { background: var(--risk-soft); color: var(--risk); border-color: var(--risk-line); }
.pill.violet { background: var(--violet-soft); color: var(--violet); border-color: var(--violet-line); }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-line); }
.pill.accent { background: var(--accent-soft); color: var(--accent-2); border-color: #d9dcff; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
h1 { font-size: 26px; line-height: 1.25; letter-spacing: -.02em; margin: 0 0 6px; font-weight: 700; }
h2 { font-size: 16px; letter-spacing: -.01em; margin: 0; font-weight: 600; }
.lead { color: var(--muted); font-size: 14.5px; margin: 0; max-width: 680px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.section-title { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 12px; }
.section-title h2 { font-size: 15px; }
.section-title span { color: var(--muted); font-size: 13px; }

/* ---------- overview ---------- */
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
.fact { padding: 18px 20px; }
.fact .k { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.fact .v { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-top: 6px; }
.fact .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.fact.risk .v { color: var(--risk); }
.overview-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.mail { overflow: hidden; }
.mail-alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 18px; background: var(--risk-soft); color: #9f1239; border-bottom: 1px solid var(--risk-line); font-size: 13px; }
.mail-head { padding: 22px 24px 4px; }
.mail-subject { font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sender { display: flex; gap: 12px; align-items: center; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; flex: none; }
.avatar.attacker { background: linear-gradient(135deg, #fb7185, #e11d48); }
.avatar.triage { background: linear-gradient(135deg, #60a5fa, #2563eb); }
.avatar.response { background: linear-gradient(135deg, #34d399, #059669); }
.avatar.agntid { background: linear-gradient(135deg, #a78bfa, #6d28d9); }
.sender-name { font-weight: 600; }
.sender-addr { color: var(--muted); font-size: 12.5px; }
.mail-body { padding: 14px 24px 8px 74px; color: var(--text-2); font-size: 14px; }
.mail-body p { margin: 0 0 12px; }
.mail-body .link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }
.injection { margin: 6px 24px 24px 74px; border: 1px dashed #f0b45a; background: var(--warn-soft); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: #6b3d06; }
.injection b { display: flex; align-items: center; gap: 6px; color: var(--warn); margin-bottom: 4px; }
.reporter-note { display: flex; gap: 12px; padding: 16px 20px; margin-bottom: 18px; align-items: flex-start; }
.reporter-note q { color: var(--text-2); font-style: italic; }
.steps-how { padding: 20px 22px; margin-bottom: 18px; }
.how { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.how:last-child { border-bottom: none; padding-bottom: 0; }
.how .n { width: 26px; height: 26px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-2); font-weight: 700; font-size: 13px; display: grid; place-items: center; flex: none; }
.how .t { font-weight: 600; font-size: 13.5px; }
.how .d { color: var(--muted); font-size: 13px; }
.scenario { padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start; }
.scenario + .scenario { border-top: 1px solid var(--border); }
.scenario .ico { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.scenario .ico.risk { background: var(--risk-soft); color: var(--risk); }
.scenario .ico.violet { background: var(--violet-soft); color: var(--violet); }
.scenario .t { font-weight: 600; }
.scenario .d { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }

/* ---------- run view ---------- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.stat { padding: 16px 18px; }
.stat .k { font-size: 12.5px; color: var(--muted); }
.stat .v { font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.2; margin-top: 4px; }
.stat.ok .v { color: var(--ok); } .stat.risk .v { color: var(--risk); } .stat.violet .v { color: var(--violet); }
.verdict { display: flex; gap: 14px; align-items: center; padding: 16px 20px; margin-top: 14px; border-radius: var(--radius); font-size: 15px; font-weight: 500; }
.verdict.risk { background: var(--risk-soft); border: 1px solid var(--risk-line); color: #881337; }
.verdict.violet { background: var(--violet-soft); border: 1px solid var(--violet-line); color: #4c1d95; }
.verdict.live { background: var(--accent-soft); border: 1px solid #d9dcff; color: var(--accent-2); }
.verdict .vi { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.7); flex: none; }
.progress { height: 3px; border-radius: 3px; background: #e4e6fb; overflow: hidden; margin-top: 10px; }
.progress span { display: block; width: 35%; height: 100%; background: var(--accent); border-radius: 3px; animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }

.timeline { margin-top: 8px; }
.agent-block { margin-top: 18px; }
.agent-head { display: flex; align-items: center; gap: 12px; padding: 0 4px 10px; }
.agent-head .name { font-weight: 600; }
.agent-head .role { color: var(--muted); font-size: 13px; }
.agent-head .n { margin-left: auto; color: var(--subtle); font-size: 12.5px; }
.steps { position: relative; padding-left: 0; }
.step { position: relative; display: grid; grid-template-columns: 40px 1fr; gap: 14px; }
.step::before { content: ""; position: absolute; left: 19px; top: 40px; bottom: -6px; width: 2px; background: var(--border); }
.step:last-child::before { display: none; }
.node { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); position: relative; z-index: 1; }
.step.ok .node { color: var(--ok); background: var(--ok-soft); border-color: var(--ok-line); }
.step.risky .node { color: var(--risk); background: var(--risk-soft); border-color: var(--risk-line); }
.step.blocked .node { color: var(--violet); background: var(--violet-soft); border-color: var(--violet-line); }
.step.identity .node { color: var(--accent); background: var(--accent-soft); border-color: #d9dcff; }
.step-card { margin-bottom: 10px; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-sm); overflow: hidden; transition: border-color .12s, box-shadow .12s; }
.step-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
.step.risky .step-card { border-color: var(--risk-line); }
.step.blocked .step-card { border-color: var(--violet-line); }
.step-top { display: flex; align-items: center; gap: 14px; padding: 12px 16px; cursor: pointer; }
.step-top .txt { flex: 1; min-width: 0; }
.step-title { font-weight: 600; font-size: 14px; }
.step-sub { color: var(--muted); font-size: 12.5px; }
.chev { color: var(--subtle); transition: transform .15s; }
.open .chev { transform: rotate(90deg); }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.risky { background: var(--risk-soft); color: var(--risk); }
.badge.blocked { background: var(--violet-soft); color: var(--violet); }
.badge.error { background: #f1f2f5; color: var(--muted); }
.badge.identity { background: var(--accent-soft); color: var(--accent-2); }
.step-detail { border-top: 1px solid var(--border); background: var(--surface-2); padding: 14px 18px 16px; font-size: 13.5px; color: var(--text-2); }
.step-detail h4 { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--subtle); margin: 0 0 6px; font-weight: 600; }
.step-detail ul { margin: 0 0 14px; padding-left: 18px; }
.step-detail li { margin: 2px 0; }
.reason { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--violet-soft); color: #4c1d95; margin-bottom: 14px; }
.decision { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 4px; }
.check { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 7px; font-size: 12px; font-weight: 500; border: 1px solid var(--border); background: var(--surface); }
.check.pass { color: var(--ok); border-color: var(--ok-line); }
.check.fail { color: var(--violet); border-color: var(--violet-line); background: var(--violet-soft); }
.check.skip { color: var(--subtle); }
.audit { color: var(--subtle); font-size: 12px; margin-top: 6px; }
code, .mono { font-family: var(--mono); font-size: 12px; }
.audit code, .tech code { background: #eef0f3; padding: 1px 6px; border-radius: 5px; color: var(--text-2); }
.tech { margin-top: 14px; }
.tech summary { cursor: pointer; color: var(--muted); font-size: 12.5px; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
.tech summary::-webkit-details-marker { display: none; }
.tech pre { margin: 10px 0 0; padding: 12px 14px; background: #0f172a; color: #cbd5e1; border-radius: 10px; max-height: 260px; overflow: auto; font-size: 11.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

.report { margin-top: 26px; }
.report-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; cursor: pointer; }
.report-head .txt { flex: 1; }
.report-body { border-top: 1px solid var(--border); padding: 18px 24px 22px; color: var(--text-2); }
.report-body h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--text); margin: 18px 0 6px; }
.report-body h4:first-child { margin-top: 0; }
.report-body p { margin: 0 0 8px; }
.report-body ul { margin: 0 0 10px; padding-left: 20px; }

.empty { padding: 48px 24px; text-align: center; }
.empty .ico { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; margin: 0 auto 14px; background: var(--accent-soft); color: var(--accent); }
.empty h2 { margin-bottom: 6px; }
.empty p { color: var(--muted); margin: 0 auto 18px; max-width: 420px; }

/* ---------- compare ---------- */
.versus { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
.vs { padding: 20px 22px; }
.vs-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.vs-head .ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; }
.vs.risk .vs-head .ico { background: var(--risk-soft); color: var(--risk); }
.vs.violet .vs-head .ico { background: var(--violet-soft); color: var(--violet); }
.vs-nums { display: flex; gap: 26px; margin-bottom: 12px; }
.vs-nums .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.vs-nums .k { color: var(--muted); font-size: 12.5px; }
.vs p { margin: 0; color: var(--text-2); }
table.cmp { width: 100%; border-collapse: separate; border-spacing: 0; }
.cmp th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.cmp th:first-child { border-top-left-radius: var(--radius); } .cmp th:last-child { border-top-right-radius: var(--radius); }
.cmp td { padding: 14px 20px; border-bottom: 1px solid var(--border); vertical-align: top; }
.cmp tr:last-child td { border-bottom: none; }
.cmp td:first-child { color: var(--text-2); font-weight: 500; width: 32%; }
.tone { display: inline-flex; gap: 8px; align-items: flex-start; }
.tone svg { margin-top: 2px; }
.tone.good { color: var(--ok); } .tone.bad { color: var(--risk); } .tone.warn { color: var(--warn); }
.tone.violet { color: var(--violet); font-weight: 700; } .tone.none { color: var(--subtle); }
.bottomline { margin-top: 18px; padding: 20px 22px; display: flex; gap: 14px; align-items: center; font-size: 15px; }
.bottomline .vi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow-lg); transition: all .2s; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.fade { animation: fade .25s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

@media (max-width: 1100px) {
  .overview-grid, .versus { grid-template-columns: 1fr; }
  .facts, .stats { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
  .content, .topbar { padding-left: 16px; padding-right: 16px; }
  .page-head { flex-direction: column; align-items: flex-start; }
}
@media (max-width: 560px) {
  .topbar { gap: 10px; }
  .crumbs { white-space: nowrap; min-width: 0; overflow: hidden; font-size: 0; }
  .crumbs > :not(#crumb-view) { display: none; }
  .crumbs #crumb-view { font-size: 14px; font-weight: 600; color: var(--text); }
  .topbar .pill { display: none; }
  .facts, .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo" data-icon="shieldcheck"></div>
      <div><div class="brand-name">PhishWarden</div><div class="brand-sub">SOC agents · guarded by AgntID</div></div>
    </div>
    <nav>
      <div class="nav-label">Incident</div>
      <a class="nav-item" href="#overview" data-view="overview"><span data-icon="mail"></span>Reported email</a>
      <div class="nav-label">Scenarios</div>
      <a class="nav-item" href="#before" data-view="before"><span data-icon="unlock"></span>Without AgntID<span class="count" id="count-before"></span></a>
      <a class="nav-item" href="#after" data-view="after"><span data-icon="shield"></span>With AgntID<span class="count" id="count-after"></span></a>
      <a class="nav-item" href="#compare" data-view="compare"><span data-icon="columns"></span>Results</a>
    </nav>
    <div class="systems">
      <div class="nav-label">Systems</div>
      <div class="sys"><span class="dot" id="h-mail"></span>Company mail server<span class="state" id="hs-mail">…</span></div>

function hydrateIcons(root = document) {

function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}
async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

    api("/api/email"), api("/api/runs/before"), api("/api/runs/after"), api("/api/compare"),
  ]);

}
async function loadHealth() {

}

function stepHTML(label, item, i) {
  const key = `${label}:${i}`, open = S.open.has(key);
  const st = item.status;
  let detail = "";
  if (open) {
    const parts = [];
    if (st === "blocked" && item.decision) parts.push(`<div class="reason">${icon("shield", "sm")}<div><b>Why AgntID stopped it:</b> ${esc(item.decision.reason)}</div></div>`);
    if (st === "error") parts.push(`<p style="margin-top:0">The tool reported an error and nothing was changed.</p>`);
    if (item.findings.length) parts.push(`<h4>What it found</h4><ul>${item.findings.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>`);
    if (item.decision) {
      const checks = item.decision.steps.map((s) => `<span class="check ${s.result}">${s.result === "pass" ? icon("check", "sm") : s.result === "fail" ? icon("x", "sm") : "–"}${esc(s.name)}</span>`).join("");
      parts.push(`<h4>AgntID decision</h4><div class="decision">${checks}</div>
        <div class="audit">${item.decision.allowed ? "Allowed" : "Denied"}${item.decision.rule ? ` by rule <code>${esc(item.decision.rule)}</code>` : ""} · audit record <code>${esc(item.decision.audit_id)}</code></div>`);
    }
    parts.push(`<details class="tech"><summary>${icon("cpu", "sm")}Technical log</summary>
      <div class="audit" style="margin-top:8px">Call <code>${esc(item.tool)}</code> with <code>${esc(JSON.stringify(item.args))}</code></div>
      <pre>${esc(item.raw)}</pre></details>`);
    detail = `<div class="step-detail">${parts.join("")}</div>`;
  }
  return `<div class="step ${st} ${open ? "open" : ""}">
    <div class="node">${icon(item.icon)}</div>
    <div class="step-card"><div class="step-top" onclick="toggleStep('${key}')">
      <div class="txt"><div class="step-title">${esc(item.title)}</div><div class="step-sub">${esc(item.subtitle)}</div></div>
      <span class="badge ${st}">${BADGE[st]}</span><span class="chev">${icon("chevron", "sm")}</span>
    </div>${detail}</div></div>`;
}

function markdown(text) {
  const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
  let out = "", list = false;
  for (const raw of esc(text).split("\n")) {
    const line = raw.trimEnd();
    const bullet = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (bullet) { if (!list) { out += "<ul>"; list = true; } out += `<li>${inline(bullet[1])}</li>`; continue; }
    if (list) { out += "</ul>"; list = false; }
    const head = line.match(/^#{1,4}\s+(.*)/);
    if (head) { out += `<h4>${inline(head[1])}</h4>`; continue; }
    if (/^-{3,}$/.test(line.trim()) || !line.trim()) continue;
    out += `<p>${inline(line)}</p>`;
  }
  return out + (list ? "</ul>" : "");
}

function viewRun(label) {
  const m = RUN_META[label], run = S.runs[label];
  if (!run) return "";
  const head = `<div class="page-head"><div>
      <div class="eyebrow">${icon(m.icon, "sm")} ${m.eyebrow}</div><h1>${m.title}</h1><p class="lead">${esc(m.lead)}</p>
      <div class="meta"><span class="pill ${m.tone === "violet" ? "violet" : ""}">${icon(m.icon, "sm")}${m.route}</span>
        ${run.model ? `<span class="pill">${icon("cpu", "sm")}${esc(run.model)}</span>` : ""}
        ${run.duration_s != null ? `<span class="pill">${icon("clock", "sm")}${run.duration_s}s</span>` : ""}</div></div>
      <button class="btn lg ${label === "after" ? "primary" : ""}" ${run.running || run.available === false ? "disabled" : ""} onclick="startRun('${label}')">
        ${icon(run.running ? "clock" : "play", "sm")}${run.running ? "Running…" : run.has_run ? "Run again" : "Run scenario"}</button></div>`;
  if (!run.has_run && !run.running) {
    return `<div class="fade">${head}<div class="card empty"><div class="ico">${icon(m.icon, "lg")}</div>
      <h2>No run yet</h2><p>Start the scenario to watch the agents investigate and respond, step by step.</p>
      <button class="btn primary lg" ${run.available === false ? "disabled" : ""} onclick="startRun('${label}')">${icon("play", "sm")}Run scenario</button></div></div>`;
  }
  const s = run.stats;
  let verdict;
  if (run.finished) {
    verdict = `<div class="verdict ${m.tone}"><div class="vi">${icon(label === "before" ? "alert" : "shieldcheck")}</div><div>${esc(run.verdict)}</div></div>`;
  } else {
    verdict = `<div class="verdict live"><div class="vi">${icon("clock")}</div><div style="flex:1">The agents are working — steps appear here as they happen.<div class="progress"><span></span></div></div></div>`;
  }
  if (run.failed) verdict += `<div class="verdict risk" style="margin-top:10px"><div class="vi">${icon("alert")}</div><div>The run stopped with an error. Check runs/${label}.stderr.log.</div></div>`;

  let blocks = "";
  const groups = [];
  run.items.forEach((item, idx) => {
    if (item.type === "agent") { groups.push({ head: item, rows: [] }); return; }
    if (!groups.length) groups.push({ head: { agent: "triage", name: "Agent", role: "" }, rows: [] });
    groups[groups.length - 1].rows.push([item, idx]);
  });
  for (const g of groups) {
    const steps = g.rows.filter(([it]) => it.type === "step").length;
    const rows = g.rows.map(([it, idx]) => {
      if (it.type === "identity") return `<div class="step identity"><div class="node">${icon("shieldcheck")}</div><div class="step-card"><div class="step-top" style="cursor:default">
        <div class="txt"><div class="step-title">Declared its identity and task to AgntID</div><div class="step-sub">Every call below is checked against this task and the security policies</div></div>
        <span class="badge identity">Identity</span></div></div></div>`;
      if (it.type === "note") return `<div class="audit" style="margin:6px 0 12px 54px">${esc(it.text)}</div>`;
      return stepHTML(label, it, idx);
    }).join("");
    blocks += `<div class="agent-block"><div class="agent-head"><div class="avatar ${g.head.agent}">${esc(g.head.initial || "A")}</div>
      <div><div class="name">${esc(g.head.name)}</div><div class="role">${esc(g.head.role)}</div></div><div class="n">${steps} action${steps === 1 ? "" : "s"}</div></div>
      <div class="steps">${rows}</div></div>`;
  }
  const report = run.finished && run.report ? `<div class="card report"><div class="report-head" onclick="toggleReport()">
      <div class="avatar response">R</div><div class="txt"><div class="step-title">Incident report written by the response agent</div><div class="step-sub">Verdict, indicators, scope, actions and next steps</div></div>
      <span class="chev" style="transform:rotate(${S.reportOpen ? 90 : 0}deg)">${icon("chevron")}</span></div>
      ${S.reportOpen ? `<div class="report-body">${markdown(run.report)}</div>` : ""}</div>` : "";
  return `<div class="fade">${head}
    <div class="stats">
      <div class="card stat"><div class="k">Actions attempted</div><div class="v">${s.attempted}</div></div>
      <div class="card stat ok"><div class="k">Safe actions done</div><div class="v">${s.ok}</div></div>
      <div class="card stat risk"><div class="k">Risky actions done</div><div class="v">${s.risky}</div></div>
      <div class="card stat violet"><div class="k">Blocked by AgntID</div><div class="v">${s.blocked}</div></div>
    </div>${verdict}
    <div class="section-title"><h2>What the agents did</h2><span>Click any step for details</span></div>
    <div class="timeline">${blocks}</div>${report}</div>`;
}

function viewCompare() {
  const c = S.compare; if (!c) return "";
  const b = S.runs.before?.stats, a = S.runs.after?.stats;
  const toneIcon = { good: "check", bad: "x", warn: "alert", violet: "shield", none: "dot" };
  const cell = (x) => `<span class="tone ${x.tone}">${x.tone !== "none" ? icon(toneIcon[x.tone], "sm") : ""}<span>${esc(x.text)}</span></span>`;
  const vs = (label, stats) => {
    const m = RUN_META[label], run = S.runs[label];
    return `<div class="card vs ${m.tone}"><div class="vs-head"><div class="ico">${icon(m.icon)}</div><div><h2>${m.title}</h2><div class="step-sub">${m.route}</div></div>
      <a class="btn" style="margin-left:auto" href="#${label}">Open</a></div>
      ${stats ? `<div class="vs-nums"><div><div class="v">${stats.attempted}</div><div class="k">actions</div></div>
        <div><div class="v" style="color:var(--risk)">${stats.risky}</div><div class="k">risky, done</div></div>
        <div><div class="v" style="color:var(--violet)">${stats.blocked}</div><div class="k">blocked</div></div></div>
        <p>${esc(run.verdict || "Run in progress…")}</p>` : `<p class="step-sub">Not run yet.</p>`}</div>`;
  };
  return `<div class="fade">
    <div class="page-head"><div><div class="eyebrow">${icon("columns", "sm")} Side by side</div><h1>Results</h1>
      <p class="lead">Same email, same AI agents, same model, same tools. The only difference is AgntID checking each action before it runs.</p></div></div>
    <div class="versus">${vs("before", b && S.runs.before.finished ? b : null)}${vs("after", a && S.runs.after.finished ? a : null)}</div>
    <div class="card"><table class="cmp"><thead><tr><th>Outcome</th><th>Without AgntID</th><th>With AgntID</th></tr></thead>
      <tbody>${c.rows.map((r) => `<tr><td>${esc(r.label)}</td><td>${cell(r.before)}</td><td>${cell(r.after)}</td></tr>`).join("")}</tbody></table></div>
    <div class="card bottomline"><div class="vi">${icon("shieldcheck")}</div><div><b>Bottom line:</b> without AgntID the AI fixed the problem and created new ones.
      With AgntID it fixed the problem — and the risky decisions stayed with a human.</div></div></div>`;
}

/* ---------------- render loop ---------------- */
function updateNav() {
  document.querySelectorAll(".nav-item").forEach((a) => a.classList.toggle("active", a.dataset.view === S.view));
  document.getElementById("crumb-view").textContent = VIEWS[S.view];
  for (const label of ["before", "after"]) {
    const el = document.getElementById(`count-${label}`), run = S.runs[label];
    el.className = "count"; el.textContent = "";
    if (!run) continue;
    if (run.running) { el.classList.add("live"); el.textContent = "Live"; }
    else if (label === "before" && run.stats.risky) { el.classList.add("risk"); el.textContent = `${run.stats.risky} risky`; }
    else if (label === "after" && run.stats.blocked) { el.classList.add("violet"); el.textContent = `${run.stats.blocked} blocked`; }
  }
}
function render() {
  const html = S.view === "overview" ? viewOverview() : S.view === "compare" ? viewCompare() : viewRun(S.view);
  const content = document.getElementById("content");
  const y = window.scrollY;
  content.innerHTML = S.animate ? html : html.replace('<div class="fade">', "<div>");
  S.animate = false;
  window.scrollTo(0, y);
  updateNav();
}
async function route() {
  const v = location.hash.replace("#", "") || "overview";
  S.view = VIEWS[v] ? v : "overview";
  S.animate = true;
  window.scrollTo(0, 0);
  if (S.view === "compare") {
    const [compare] = await Promise.all([api("/api/compare"), loadRun("before"), loadRun("after")]);
    S.compare = compare;
  }
  if (S.view === "before" || S.view === "after") await loadRun(S.view);
  render();
}
async function poll() {
  const live = ["before", "after"].filter((l) => S.runs[l]?.running);
  if (!live.length) return;
  await Promise.all(live.map(loadRun));
  if (live.some((l) => !S.runs[l].running)) { S.compare = await api("/api/compare"); toast("Run finished"); }
  render();
}

document.getElementById("reset-btn").addEventListener("click", resetMailbox);
window.addEventListener("hashchange", route);
hydrateIcons();
(async () => {
  try { await loadAll(); } catch (e) { toast(e.message); }
  await route();
  loadHealth();
  setInterval(poll, 1500);
  setInterval(loadHealth, 10000);
})();
</script>
